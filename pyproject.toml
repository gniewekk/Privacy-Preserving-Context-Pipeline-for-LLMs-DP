[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-preserving-context-pipeline"
version = "0.1.0"
description = "Privacy-preserving PII/PHI anonymization and pseudonymization pipeline for LLMs"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "cryptography>=42.0",
    "fastapi>=0.110",
]

[project.optional-dependencies]
ner = [
    "torch>=2.2",
    "transformers>=4.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
