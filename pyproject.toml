[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-preserving-context-pipeline"
version = "0.1.0"
description = "Privacy-preserving PII pipeline skeleton"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ner = [
    "torch>=2.2",
    "transformers>=4.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
