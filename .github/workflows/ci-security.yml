name: CI Quality, Type Safety & Security Gate

on:
  push:
    branches: ["main", "develop", "milestone/**"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  quality-and-security:
    name: Lint, Typecheck, Test, SAST & Dependency Audit (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and security verification tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff mypy bandit pip-audit

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check src/ tests/

      - name: Run Strict Mypy Static Type Analysis
        run: |
          mypy --strict src/

      - name: Run Unit, Integration & Security Abuse Test Suite (pytest)
        run: |
          pytest -v

      - name: Run Bandit SAST (Static Application Security Testing)
        run: |
          bandit -r src/ -ll -ii

      - name: Run Supply-Chain Dependency Vulnerability Scan (pip-audit)
        run: |
          pip-audit
